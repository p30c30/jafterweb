<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Galería Jafter - Fotografía Inspiradora</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

  <!-- Tipografía para el logo/título (si la usas en tus estilos) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@600;700&display=swap" rel="stylesheet">

  <!-- CSS (responsive el último) -->
  <link rel="stylesheet" href="styles/main.css?v=36">
  <link rel="stylesheet" href="styles/layout.css?v=36" />
  <link rel="stylesheet" href="styles/components.css?v=36" />
  <link rel="stylesheet" href="styles/carrusel.css?v=36" />
  <link rel="stylesheet" href="styles/modal.css?v=36" />
  <link rel="stylesheet" href="styles/responsive.css?v=36" />
</head>
<body>
  <!-- Header -->
  <header class="site-header">
    <!-- Logo pequeño a la izquierda del título -->
    <img
      class="title-logo"
      src="https://jafterpic.com/assets/logos/jafter-blanco.svg"
      alt="Jafter"
      style="display:inline-block;height:22px;width:auto;max-width:none;margin-right:12px;vertical-align:middle;opacity:.96;filter:drop-shadow(0 1px 1px rgba(0,0,0,.22));transition:transform .15s ease,opacity .15s ease;">
    <div id="logoHome">Galería Jafter</div>
  </header>

  <main id="content" class="container">
    <!-- Vista principal -->
    <div id="home-view" class="home-view">
      <!-- Secciones/tarjetas se cargarán aquí -->
      <div id="secciones-container" class="section-cards"></div>

      <!-- Sección Últimas Fotos CON CARRUSEL -->
      <section class="ultimas-fotos-section">
        <h2>Centro de Contenido</h2>
        <div class="carrusel-container">
          <button class="carrusel-btn prev-btn">‹</button>
          <div class="carrusel">
            <div id="ultimas-fotos-carrusel" class="carrusel-inner"></div>
          </div>
          <button class="carrusel-btn next-btn">›</button>
        </div>
        <div class="carrusel-dots" id="carrusel-dots"></div>
      </section>
      
      <!-- Sección inspiradora -->
      <div id="inspiration-section">
        <div>
          <div>
            <h2>Capturar el Momento</h2>
            <p class="insp-quote">En la fotografía, cada instante es único e irrepetible...</p>
            <p class="insp-quote">Cada fotografía es un diálogo silencioso...</p>
            <p class="insp-quote">Porque al final, fotografiar es mucho más que presionar un botón...</p>
          </div>
          <div class="inspiration-image">
            <img src="https://images2.imgbox.com/a7/ae/imIfzK4c_o.jpg" alt="Retrato artístico" />
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Modal para fotos -->
  <div id="modal" class="modal"></div>
  
  <footer class="site-footer">
    <div class="contact-info">
      Contacto: <a href="mailto:jafterphoto@gmail.com">jafterphoto@gmail.com</a> /
      <a href="https://www.facebook.com/profile.php?id=61571917450059&locale=es_ES">Facebook</a>
    </div>
    <!-- Última línea centrada en solitario -->
    <div class="site-copy" style="text-align:center;margin-top:10px;">
      © 2025 Galería Jafter
    </div>
  </footer>

  <script src="script36.js?v=36" defer></script>
</body>
</html>
